</style><script data-image-loading>// SVG image definitions load when the artwork that uses them approaches view.
(() => {
  let watched = new WeakSet();
  let targets = new WeakMap();
  let currentMain = null;
  let modelsLoading = false;
  const deferred = new Set();
  function load(image) {
    const source = image.getAttribute('data-image-src');
    if (!source) return;
    if (modelsLoading) { deferred.add(image); return; }
    image.setAttribute('href', source);
    image.removeAttribute('data-image-src');
  }
  function modelLoading(value) {
    modelsLoading = value;
    if (!value) {
      for (const image of deferred) load(image);
      deferred.clear();
    }
  }
  const observer = window.IntersectionObserver ? new window.IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      for (const image of targets.get(entry.target) || []) load(image);
      observer.unobserve(entry.target);
    }
  }, {rootMargin: '500px 0px'}) : null;

  function observe(main) {
    if (main !== currentMain) {
      observer?.disconnect();
      watched = new WeakSet();
      targets = new WeakMap();
      currentMain = main;
      deferred.clear();
    }
    for (const svg of main.querySelectorAll('svg')) {
      if (watched.has(svg)) continue;
      watched.add(svg);
      const images = [...svg.querySelectorAll('image[data-image-src]')].filter(image => image.ownerSVGElement === svg);
      if (!images.length) continue;
      if (!observer) { images.forEach(load); continue; }
      const pending = new Set(images);
      const registry = new Map([...svg.querySelectorAll('[id]')].map(node => [node.id, node]));
      function dependencies(node, seen = new Set()) {
        if (seen.has(node)) return new Set();
        seen.add(node);
        const result = new Set(pending.has(node) ? [node] : []);
        for (const current of [node, ...node.querySelectorAll('*')]) {
          for (const attribute of current.attributes) {
            const references = [...attribute.value.matchAll(/url\(#([^\)]+)\)/g)].map(match => match[1]);
            if (current.localName === 'use' && ['href', 'xlink:href'].includes(attribute.name) && attribute.value.startsWith('#')) references.push(attribute.value.slice(1));
            for (const id of references) {
              const referenced = registry.get(id);
              if (referenced) for (const image of dependencies(referenced, seen)) result.add(image);
            }
          }
        }
        return result;
      }
      for (const node of svg.querySelectorAll('[fill], [stroke], image[data-image-src]')) {
        if (node.ownerSVGElement !== svg || node.closest('defs')) continue;
        const needed = dependencies(node);
        if (!needed.size) continue;
        targets.set(node, needed);
        observer.observe(node);
      }
    }
  }
  window.portfolioImages = {observe, modelLoading};
})();
</script><script data-portfolio-startup>// Runs in the head, independently of model-viewer and the main module graph.
(() => {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  const entryURL = location.href;
  let interacted = false;
  const media = matchMedia('(max-width: 600px)');

  function resetScroll() {
    if (!interacted && !location.hash && location.href === entryURL) {
      window.scrollTo({top: 0, behavior: 'instant'});
    }
  }

  function mountArtwork(main, phoneLayout) {
    if (!main) return;
    const desktop = main.querySelector('template.desktop-artwork');
    if (!desktop) return;
    const phone = main.querySelector('template.phone-artwork');
    const drawn = main.querySelector(':scope > .design');
    const desired = phoneLayout ? phone : desktop;
    if (drawn && (phone ? drawn.dataset.artworkLayout !== (phoneLayout ? 'mobile' : 'desktop') : phoneLayout)) {
      (drawn.dataset.artworkLayout === 'mobile' ? phone : desktop).content.append(drawn);
    }
    if (desired?.content.firstElementChild) {
      const artwork = desired.content.firstElementChild;
      artwork.dataset.artworkLayout = phoneLayout ? 'mobile' : 'desktop';
      main.prepend(artwork);
    }
  }

  function ready() {
    mountArtwork(document.querySelector('main'), media.matches);
    window.portfolioImages?.modelLoading(Boolean(document.querySelector('main')?.querySelector('[data-model-slot]')));
    window.portfolioImages?.observe(document.querySelector('main'));
    resetScroll();
    requestAnimationFrame(resetScroll);
  }

  window.portfolioStartup = {mountArtwork, resetScroll, ready};
  media.addEventListener('change', () => mountArtwork(document.querySelector('main'), media.matches));
  for (const event of ['pointerdown', 'touchstart', 'wheel', 'keydown']) {
    window.addEventListener(event, () => { interacted = true; }, {once: true, passive: true});
  }
  window.addEventListener('pageshow', event => { if (!event.persisted) resetScroll(); });
  resetScroll();
})();

he given designs for the whole bike with individual parts is available in parametric formats. This bike is currently a concept only and no prototyping has been done.</p></div></foreignObject><foreignObject data-project-font="Be Vietnam Pro" x="740.7120" y="1308.4266" width="581.8320" height="44.5814" data-native-text="true" style="overflow:visible;pointer-events:auto"><div xmlns="http://www.w3.org/1999/xhtml" class="native-copy" style="position:relative;color:white;font-family:&quot;Be Vietnam Pro&quot;,sans-serif;font-size:15.3729px;line-height:1.25;margin:0;overflow-wrap:break-word;user-select:text"><p style="margin:0;font:inherit;white-space:pre-line">A music synthesizer designed and prototyped from scratch with surface sound based sampling using piezo discs</p></div></foreignObject><foreignObject data-project-font="Be Vietnam Pro" x="738.6480" y="2318.7595" width="555.1760" height="61.4401" data-native-text="true" style="overflow:visible;pointer-events:auto"><div xmlns="http://www.w3.org/1999/xhtml" class="native-copy" style="position:relative;color:white;font-family:&quot;Be Vietnam Pro&quot;,sans-serif;font-size:14.6502px;line-height:1.25;margin:0;overflow-wrap:break-word;user-select:text"><p style="margin:0;font:inherit;white-space:pre-line">Wisp is a minimal, clamp-on desk lamp designed for flexibility. Its rotating and revolving arms let you direct light exactly where needed. Named for its sleek, airy form, Wisp blends function and elegance in one adaptable design.</p></div></foreignObject><foreignObject data-project-font="Be Vietnam Pro" x="739.7120" y="1829.4266" width="576.6100" height="63.7975" data-native-text="true" style="overflow:visible;pointer-events:auto"><div xmlns="http://www.w3.org/1999/xhtml" class="native-copy" style="position:relative;color:black;font-family:&quot;Be Vietnam Pro&quot;,sans-serif;font-size:15.3729px;line-height:1.25;margin:0;overflow-wrap:break-word;user-select:text"><p style="margin:0;font:inherit;white-space:pre-line">A modular battery charging and storage system for homes, commercial properties and industrial scale usage. Charging units can be organised in any layout, stacked or swapped.</p></div></foreignObject><foreignObject x="743.2780" y="1025.6449" width="261.3820" height="23.2462" data-native-text="true" style="overflow:visible;pointer-events:auto" data-metadata="software"><div xmlns="http://www.w3.org/1999/xhtml" class="native-copy" style="position:relative;color:black;font-family:&quot;Be Vietnam Pro&quot;,sans-serif;font-size:14.0886px;line-height:1.25;margin:0;overflow-wrap:break-word;user-select:text"><p style="margin:0;font:inherit;white-space:pre-line" data-metadata-label="true">software stack</p></div></foreignObject><foreignObject x="743.1480" y="964.5869" width="32.8350" height="20.2116" data-native-text="true" style="overflow:visible;pointer-events:auto"><div xmlns="http://www.w3.org/1999/xhtml" class="native-copy" style="position:relative;color:black;font-family:&quot;Be Vietnam Pro&quot;,sans-serif;font-size:11.9771px;line-height:1.25;margin:0;overflow-wrap:break-word;user-select:text"><p style="margin:0;font:inherit;white-space:pre-line">2026</p></div></foreignObject><foreignObject x="743.1480" y="1444.5839" width="32.8350" height="20.2116" data-native-text="true" style="overflow:visible;pointer-events:auto"><div xmlns="http://www.w3.org/1999/xhtml" class="native-copy" style="position:relative;color:white;font-family:&quot;Be Vietnam Pro&quot;,sans-serif;font-size:11.9771px;line-height:1.25;margin:0;overflow-wrap:break-word;user-select:text"><p style="margin:0;font:inherit;white-space:pre-line">2026</p></div></foreignObject><foreignObject x="743.1480" y="1963.5839" width="32.8350" height="20.2116" data-native-text="true" style="overflow:visible;pointer-events:auto"><div xmlns="http://www.w3.org/1999/xhtml" class="native-copy" style="position:relative;color:black;font-family:&quot;Be Vietnam Pro&quot;,sans-serif;font-size:11.9771px;line-height:1.25;margin:0;overfl
